---
name: build

on:
  workflow_dispatch: {}
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  core:
    strategy:
      matrix:
        go-version: [1.26.x]
        platform: [ubuntu-latest]
    name: Build
    runs-on: ${{ matrix.platform }}
    env:
      GOBIN: /home/runner/.local/bin
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - name: Amend Environment Path
      run: |
        mkdir -p /home/runner/.local/bin
        echo "/home/runner/.local/bin" >> $GITHUB_PATH
    - name: Setup Environment
      run: |
        mkdir -p .coverage
        echo "*** Current Directory ***"
        pwd
        echo "*** Environment Variables ***"
        env | sort
        echo "*** Executable Path ***"
        echo "$PATH" | tr ':' '\n'
        echo "*** Workspace Files ***"
        find .
        which make
    - name: Install prerequisites
      run: |
        sudo apt-get --assume-yes install make
        sudo apt-get --assume-yes install libnss3-tools
        sudo apt-get install openvswitch-switch
        sudo apt-get update
    - name: Install Go modules
      run: |
        go mod download
        go mod tidy
    - name: Open vSwitch Checks
      run: |
        sudo ovs-vsctl --version
        sudo ovs-vsctl show
        sudo systemctl status openvswitch-switch.service
        sudo ovs-vsctl add-br br0
        sudo ovs-vsctl list bridge
        sudo ps -ef
    - name: Validate prerequisites
      run: |
        echo "*** Local binaries ***"
        find /home/runner/.local/bin || true
    - name: Build
      run: |
        make BUILD_OS=linux BUILD_ARCH=amd64
    - name: Run tests
      run: |
        go test ./pkg/ovn_exporter/
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: ovn-exporter-linux-amd64
        path: bin/linux-amd64/ovn-exporter